name: Admin browser checks
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['admin-app/**', 'tests/**', '.github/workflows/admin-checks.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-smoke.mjs
