<div class="cards-search">
  <input
    id="cardsSearch"
    class="cards-search__input"
    type="search"
    placeholder="{{ site.data.managed.labels.search | escape }}"
    autocomplete="off"
  />
  <div class="cards-search__meta muted" id="cardsSearchMeta"></div>
</div>

<script>
(function () {
  function ready(fn){ if(document.readyState!=="loading") fn(); else document.addEventListener("DOMContentLoaded", fn); }

  ready(function(){
    var input = document.getElementById("cardsSearch");
    if(!input) return;

    // Limit filtering to the main content so sidebar text doesn’t interfere
    var root = document.querySelector(".content") || document;
    var cards = Array.from(root.querySelectorAll("article.info-card"));
    var meta  = document.getElementById("cardsSearchMeta");

    if(cards.length === 0){
      if(meta) meta.textContent = {{ site.data.managed.labels.search_no_cards | jsonify }};
      return;
    }

    function normalize(s){
      return (s || "").toLowerCase().replace(/\s+/g, " ").trim();
    }

    function update(){
      var q = normalize(input.value);
      var shown = 0;

      cards.forEach(function(card){
        var text = normalize(card.innerText);
        var match = q === "" || text.indexOf(q) !== -1;
        card.style.display = match ? "" : "none";
        if(match) shown++;
      });

      if(meta){
        if(q === ""){
          meta.textContent = {{ site.data.managed.labels.search_showing | append: " " | jsonify }} + shown + {{ site.data.managed.labels.search_items | prepend: " " | jsonify }};
        }else{
          meta.textContent = {{ site.data.managed.labels.search_showing | append: " " | jsonify }} + shown + {{ site.data.managed.labels.search_of | prepend: " " | append: " " | jsonify }} + cards.length + {{ site.data.managed.labels.search_items | prepend: " " | jsonify }};
        }
      }
    }

    input.addEventListener("input", update);
    update();
  });
})();
</script>
