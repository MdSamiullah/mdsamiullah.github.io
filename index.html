---
layout: default
title: Home
permalink: /
---
{{ site.data.managed.pages.home.body }}
<div class="quickcards">
{% for card in site.data.managed.pages.home.cards %}
<a class="qcard" href="{{ card.url | relative_url }}">
<div class="qcard__thumb qcard__thumb--icon"><img src="{{ card.image | relative_url }}" alt="{{ card.title }}"></div>
<h3 class="qcard__title">{{ card.title }}</h3>
<div class="qcard__text">{{ card.description }}</div>
<div class="qcard__cta">{{ card.button }} <span>→</span></div>
</a>
{% endfor %}
</div>
